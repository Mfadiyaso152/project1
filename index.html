<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="منصة وثيق - المنصة الأولى لدمج وتوثيق المستندات والختم الإلكتروني والتواقيع على الورقة الرسمية بكل أمان وسهولة." />
    <meta name="keywords" content="وثيق, توثيق المستندات, دمج المستندات, ختم إلكتروني, توقيع إلكتروني, ورقة رسمية, تصديق المستندات, Wathiq" />
    <meta name="author" content="وثيق" />
    <meta name="robots" content="index, follow" />
    <title>وثيق|wathiq</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <meta name="application-name" content="وثيق|wathiq" />
    <meta name="apple-mobile-web-app-title" content="وثيق|wathiq" />
    <meta property="og:title" content="وثيق|wathiq" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cairo:wght@200;300;400;500;600;700;800;900&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- PDF.js library to support reading/rendering PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
      if (typeof pdfjsLib !== 'undefined') {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
      }
    </script>
    <style>
      body {
        font-family: 'Cairo', sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* IE and Edge */
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      ::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      *::-webkit-scrollbar {
        display: none !important;
      }
      
      /* Luxury Keyframes & Smooth Spring Transitions */
      @keyframes pageLuxuryEnter {
        0% {
          opacity: 0;
          transform: translateY(16px) scale(0.99);
          filter: blur(4px);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0px);
        }
      }
      
      @keyframes luxuryCardFloat {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-4px);
        }
      }

      @keyframes modalSpringIn {
        0% {
          opacity: 0;
          transform: scale(0.92) translateY(20px);
        }
        70% {
          transform: scale(1.015) translateY(-2px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @keyframes pageSlideFade {
        0% {
          opacity: 0.4;
          transform: scale(0.98);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes shimmerLux {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      
      @keyframes pulseGlow {
        0%, 100% {
          opacity: 0.6;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.05);
        }
      }

      @keyframes luxurySpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes luxurySpinReverse {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      
      .animate-page-enter {
        animation: pageLuxuryEnter 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-fade-in-up {
        animation: pageLuxuryEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-fade-in {
        animation: pageSlideFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-scale-in {
        animation: modalSpringIn 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-pulse-glow {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }

      .animate-spin-slow {
        animation: luxurySpin 10s linear infinite;
      }

      .animate-spin-reverse-slow {
        animation: luxurySpinReverse 7s linear infinite;
      }

      .animate-card-float {
        animation: luxuryCardFloat 6s ease-in-out infinite;
      }

      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 20px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 20px);
      }

      html { 
        scroll-behavior: smooth; 
      }

      /* Specific smooth transitions for buttons and cards without lagging drag items */
      button, a, input, select, textarea, .transition-smooth {
        transition-property: color, background-color, border-color, box-shadow, transform, opacity;
        transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        transition-duration: 220ms;
      }
      
      /* Active element spring bounce */
      button:active:not(:disabled), a:active {
        transform: scale(0.975);
      }

      /* Dragging elements must NEVER animate position */
      .canvas-draggable {
        transition: none !important;
        will-change: left, top;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
